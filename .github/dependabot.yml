# Weekly dependency updates. Expo SDK, React Native and React change together
# (see `npx expo install --check`), so Dependabot does not open major updates for them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'jest-expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # These packages have the same version as React Native.
      - dependency-name: '@react-native/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # The Expo SDK sets these versions. Use `npx expo install --fix` in apps/mobile.
      - dependency-name: 'react-native-safe-area-context'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # pnpm-workspace.yaml pins one React version for the Expo SDK.
      - dependency-name: 'react'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # CI and the engines field use Node.js 24. Update the types with Node.js.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
