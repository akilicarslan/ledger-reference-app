name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, unit tests, contract and compiler checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - name: OpenAPI document is up to date
        run: pnpm openapi:check
      - name: React Compiler compiles all components
        run: pnpm compiler:report
      - name: Storybook builds
        run: pnpm build:storybook
      - name: Web app builds
        run: pnpm build:web

  e2e-ios:
    name: Detox (iOS simulator)
    # Expensive job: run it on main only.
    if: github.ref == 'refs/heads/main'
    needs: verify
    # Expo SDK 57 and React Native 0.86 need Xcode 26 (Swift 6.2).
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: brew tap wix/brew && brew install wix/brew/applesimutils
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e:build:ios
      - run: pnpm e2e:test:ios -- --headless --record-logs failing
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detox-artifacts
          path: apps/mobile/artifacts
